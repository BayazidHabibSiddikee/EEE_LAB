<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f1a" />
    <title>LABGEN // CYBERDECK TERMINAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --scrollbar-track: #0a0f1a;
        --scrollbar-thumb: #00ffc8;
        --scrollbar-thumb-hover: #00e6b8;
      }
      * { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track); }
      *::-webkit-scrollbar { width: 8px; height: 8px; }
      *::-webkit-scrollbar-track { background: var(--scrollbar-track); }
      *::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
      *::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }
      html { overflow: hidden; }
      body { overflow: hidden; }
    </style>
  </head>
  <body class="cyber-bg text-cyber-text font-mono antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
